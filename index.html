"朋友說我是個有才幹的人,我會利用這些才能來幫助別人,但似乎沒有利用到這些天賦,來使自己在事業上或是家庭中得到利益。",
"我喜歡嘗試新奇事物和不同的生活型態,如果有機會的話,我不排斥嘗試毒品或是到蠻荒地區冒險。",
"我發現有一些人故意做一些事煩擾、侮辱我,他們的目的只是想挑釁我。",
"有人說我天真無知的可愛,對人的包容性也出奇地大,有時候會被利用,甚至有時被人利用而不自知。",
"我並不需要與很多人建立起親近的人際關係,我會把大部分的精力,專注在思想哲理、抽象概念和超自然等內心世界的探討上。",
"當我遇到挫折時,我喜歡自己面對困難,當別人對我伸出援手幫助我時,我往往會覺得不自在,無法坦然接受別人所釋出的善意。"];
var N=Q.length, KEY="p14v2";
var S={view:"intro",i:0,a:{},name:"",blood:"",birth:"",showMap:false};
try{var saved=JSON.parse(localStorage.getItem(KEY)||"null");if(saved&&saved.a){S.a=saved.a;S.name=saved.name||"";S.blood=saved.blood||"";S.birth=saved.birth||"";S.i=saved.i||0}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify({a:S.a,name:S.name,blood:S.blood,birth:S.birth,i:S.i}))}catch(e){}}
function count(){return Object.keys(S.a).length}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
var app=document.getElementById("app");

function intro(){
  var c=count();
  app.innerHTML='<div class="stack">'+
  '<div class="stack" style="gap:6px"><div class="eyebrow">130 題 · 14 種人格典型</div><h1>14 人格心座測驗</h1>'+
  '<p class="muted" style="margin:0">依直覺作答,不用想太久。每題選一個最接近你的答案。</p></div>'+
  '<div class="panel stack"><h2>參加者資料</h2><div class="row">'+
  '<label class="f">姓名<input id="fName" value="'+esc(S.name)+'" placeholder="選填"></label>'+
  '<label class="f">生日<input id="fBirth" type="date" value="'+esc(S.birth)+'"></label></div><div class="hint">作答進度會保存在這台裝置上。</div></div>'+
  '<button class="primary" id="go">'+(c?(c===N?'查看結果':'繼續作答(已完成 '+c+' 題)'):'開始測驗')+'</button>'+
  (c?'<button class="ghost" id="reset">清除作答,重新開始</button><div id="cfm"></div>':'')+
  '</div>';
  function grab(){S.name=fName.value.trim();S.birth=fBirth.value;save()}
  ["fName","fBirth"].forEach(function(id){document.getElementById(id).addEventListener("change",grab)});
  go.onclick=function(){grab();if(c===N){S.view="result"}else{S.view="quiz";S.i=firstMissing()}render()};
  if(c){reset.onclick=function(){cfm.innerHTML='<div class="row" style="margin-top:4px"><span class="hint" style="flex-basis:100%">確定要清除全部 '+c+' 題的答案嗎?</span><button id="yes" class="primary">清除</button><button id="no">取消</button></div>';
    yes.onclick=function(){S.a={};S.i=0;save();render()};no.onclick=function(){cfm.innerHTML=""}}}
}
function firstMissing(){for(var i=0;i<N;i++)if(S.a[i+1]===undefined)return i;return N-1}

function quiz(){
  var n=S.i+1,c=count(),v=S.a[n];
  var opts=[["是的",2],["或許",1],["不是",0]];
  app.innerHTML='<div class="bar"><div class="top"><button class="ghost" id="home" style="padding:4px 10px">← 首頁</button><span>已答 '+c+' / '+N+'</span><button class="ghost" id="tmap" style="padding:4px 10px">'+(S.showMap?'收起總覽':'題目總覽')+'</button></div><div class="track"><i style="width:'+(c/N*100)+'%"></i></div></div>'+
  '<div class="stack" style="margin-top:12px">'+
  (S.showMap?'<div class="panel stack" style="padding:14px"><div class="map">'+Q.map(function(_,k){var m=k+1;return '<button data-j="'+k+'" class="'+(S.a[m]!==undefined?'done':'')+(k===S.i?' cur':'')+'">'+m+'</button>'}).join("")+'</div><div class="hint">深色為已作答,點題號可跳題修改。</div></div>':'')+
  '<div class="qnum">'+n+'<small>/ '+N+'</small></div>'+
  '<div class="qtext">'+Q[S.i]+'</div>'+
  '<div class="opts">'+opts.map(function(o,k){return '<button data-v="'+o[1]+'" class="'+(v===o[1]?'on':'')+'">'+o[0]+'<span>'+o[1]+' 分</span></button>'}).join("")+'</div>'+
  '<div class="nav"><button id="prev"'+(S.i===0?' disabled':'')+'>上一題</button>'+
  (c===N?'<button class="primary" id="fin">查看結果</button>':'<button id="next">'+(S.i===N-1?'找未答題':'下一題')+'</button>')+'</div>'+
  '<div class="hint">電腦可用鍵盤 1 / 2 / 3 作答,← → 切換題目。</div></div>';
  app.querySelectorAll(".opts button").forEach(function(b){b.onclick=function(){answer(+b.dataset.v)}});
  app.querySelectorAll(".map button").forEach(function(b){b.onclick=function(){S.i=+b.dataset.j;save();render()}});
  home.onclick=function(){S.view="intro";render()};
  tmap.onclick=function(){S.showMap=!S.showMap;render()};
  prev.onclick=function(){if(S.i>0){S.i--;save();render()}};
  if(window.next&&next.id==="next")next.onclick=function(){S.i=S.i<N-1?S.i+1:firstMissing();save();render()};
  var f=document.getElementById("fin");if(f)f.onclick=function(){S.view="result";render()};
}
var lock=false;
function answer(v){
  if(lock)return;var n=S.i+1;S.a[n]=v;save();
  app.querySelectorAll(".opts button").forEach(function(b){b.classList.toggle("on",+b.dataset.v===v)});
  if(count()===N&&S.i===N-1){render();return}
  lock=true;setTimeout(function(){lock=false;
    if(S.i<N-1)S.i++;else S.i=firstMissing();
    if(count()===N&&S.a[S.i+1]!==undefined){render();return}
    save();render()},220);
}

function scores(){return MAP.map(function(m,k){return{n:TYPES[k],s:m.reduce(function(t,q){return t+(S.a[q]||0)},0),k:k}})}
function result(){
  var sc=scores(),rank=sc.slice().sort(function(a,b){return b.s-a.s||a.k-b.k}),cut=rank[2].s;
  var W=700,H=300,L=34,R=12,T=14,B=46,cw=(W-L-R)/14,y=function(v){return T+(H-T-B)*(1-v/18)};
  var g='';for(var t=0;t<=18;t+=3){g+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y(t)+'" y2="'+y(t)+'" stroke="var(--line)" stroke-width="1"/><text x="'+(L-8)+'" y="'+(y(t)+4)+'" text-anchor="end" font-size="11" fill="var(--muted)">'+t+'</text>'}
  var pts=sc.map(function(o,k){return[L+cw*(k+.5),y(o.s)]});
  var path='<polyline points="'+pts.map(function(p){return p.join(",")}).join(" ")+'" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round"/>';
  var dots=sc.map(function(o,k){var hi=o.s>=cut&&o.s>0;return '<circle cx="'+pts[k][0]+'" cy="'+pts[k][1]+'" r="'+(hi?6:4)+'" fill="'+(hi?'var(--mark)':'var(--surface)')+'" stroke="var(--accent)" stroke-width="2"/>'+
    '<text x="'+pts[k][0]+'" y="'+(pts[k][1]-11)+'" text-anchor="middle" font-size="11" font-weight="700" fill="var(--ink)">'+o.s+'</text>'+
    '<text x="'+pts[k][0]+'" y="'+(H-B+20)+'" text-anchor="middle" font-size="12" fill="var(--'+(hi?'ink':'muted')+')" font-weight="'+(hi?700:400)+'">'+o.n+'</text>'}).join("");
  var svg='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="14 種人格典型分數曲線">'+g+path+dots+'</svg>';
  var who=[["姓名",S.name],["生日",S.birth]].filter(function(x){return x[1]}).map(function(x){return '<span>'+x[0]+' <b>'+esc(x[1])+'</b></span>'}).join("");
  app.innerHTML='<div class="stack">'+
  '<div class="stack" style="gap:6px"><div class="eyebrow">測驗結果</div><h1>你的人格曲線</h1>'+(who?'<div class="who">'+who+'</div>':'')+'</div>'+
  '<div class="podium">'+rank.slice(0,3).map(function(o,k){return '<div><div class="rk">第 '+(k+1)+' 名</div><div class="nm">'+o.n+'型</div><div class="sc">'+o.s+' / 18</div></div>'}).join("")+'</div>'+
  '<div class="panel stack" style="padding:16px 12px"><h2 style="padding:0 6px">測試題目曲線圖</h2><div class="chartbox">'+svg+'</div><div class="hint" style="padding:0 6px">金色點為得分最高的典型(同分並列)。</div></div>'+
  '<div class="panel stack"><h2>分數排名</h2><div class="bars">'+rank.map(function(o){return '<div class="b'+(o.s>=cut&&o.s>0?' hi':'')+'"><span>'+o.n+'型</span><span class="t"><i style="width:'+(o.s/18*100)+'%"></i></span><span class="v">'+o.s+'</span></div>'}).join("")+'</div></div>'+
  '<button class="primary" id="copy">複製結果文字</button><div class="toast" id="toast" aria-live="polite"></div>'+
  '<textarea id="ctext" readonly hidden style="width:100%;min-height:9em;font:inherit;border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--surface);color:var(--ink)"></textarea>'+
  '<div class="row"><button id="edit">返回修改答案</button><button id="home">回首頁</button></div>'+
  '<div class="hint">註:原表第 24、44 題同時計入貓頭鷹型與駱駝型,依原表計分。</div></div>';
  var txt='【14 人格心座測驗結果】\n'+(S.name?'姓名:'+S.name+'\n':'')+(S.birth?'生日:'+S.birth+'\n':'')+
    '前三名:'+rank.slice(0,3).map(function(o){return o.n+'型 '+o.s}).join('、')+'\n\n'+sc.map(function(o){return o.n+'型 '+o.s}).join('\n');
  copy.onclick=function(){var done=function(){toast.textContent="已複製,可以貼到 LINE 或訊息裡。"};
    var fail=function(){ctext.value=txt;ctext.hidden=false;ctext.focus();ctext.select();toast.textContent="無法自動複製,請手動選取下方文字複製。"};
    try{navigator.clipboard.writeText(txt).then(done,fail)}catch(e){fail()}};
  edit.onclick=function(){S.view="quiz";S.i=0;S.showMap=true;render()};
  home.onclick=function(){S.view="intro";render()};
}
function render(){window.scrollTo(0,0);if(S.view==="intro")intro();else if(S.view==="quiz")quiz();else result()}
document.addEventListener("keydown",function(e){
  if(S.view!=="quiz"||/INPUT|SELECT|TEXTAREA/.test(e.target.tagName))return;
  if(e.key==="1")answer(2);else if(e.key==="2")answer(1);else if(e.key==="3")answer(0);
  else if(e.key==="ArrowLeft"&&S.i>0){S.i--;save();render()}
  else if(e.key==="ArrowRight"&&S.i<N-1){S.i++;save();render()}
});
render();
</script>
